# AgentViewKit CI. The shared `swift-ci` reusable workflow builds and tests the
# package on the self-hosted macOS runner of the org. That workflow lives in
# the swissarmyhammer/workflows repository, and EditorKit uses the same
# pattern. The runner runs macOS 27 or newer. No job uses a GitHub-hosted
# `macos-*` runner, because those runners used up the Actions minutes of the
# org (see the EditorKit workflow for the history).
#
# Jobs:
#   - ci: the shared build and test job. Its unit job runs `swift build
#     --build-tests` and `swift test` with the Xcode and Swift toolchain of
#     the runner: the unit tests only, with no window and no capture. It also
#     builds the nested `IntegrationTests/` package. Its integration job runs
#     that package after the unit job: the hosted, snapshot, pixel, focus-ring
#     and review gallery tests. Its examples job is the demo gate:
#     `Scripts/test-examples.sh` makes the Xcode project of each example
#     again, builds it, and runs its UI tests. Unit, integration and examples
#     are the same three gates in every view kit; no job builds documentation.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: swissarmyhammer/workflows/.github/workflows/swift-ci.yaml@main
    with:
      # The integration suite is a nested package. This input makes the unit
      # job build it on every run and makes the integration job run it.
      integration-package-path: IntegrationTests
      # The demo gate: each leg runs `Scripts/test-examples.sh <name>`, which
      # regenerates the project, builds the app, and runs its UI tests. The UI
      # tests need a logged-in console session of the runner user, an unlocked
      # screen, and UI Automation Mode on for that user (one time, by a person:
      #   sudo automationmodetool enable-automationmode-without-authentication).
      examples: '["AgentViewKitDemo"]'
